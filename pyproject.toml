[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "AI customer support agent built from historical Twitter support conversations"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "pyarrow>=17,<23",
    "tqdm>=4.66,<5",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.8,<3",
    "kagglehub>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"